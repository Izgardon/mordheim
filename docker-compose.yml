services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: mordheim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
    # Dev only: hot reload. The image itself serves with gunicorn.
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: mordheim
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "dev-secret-key"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
      # Realtime goes to the local soketi server, never the production Pusher app,
      # whatever backend/.env contains.
      PUSHER_APP_ID: "1234"
      PUSHER_KEY: mordheim-local-key
      PUSHER_SECRET: mordheim-local-secret
      PUSHER_CLUSTER: local
      PUSHER_HOST: soketi
      PUSHER_PORT: "6001"
      PUSHER_USE_TLS: "0"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    ports:
      - "8000:8000"
    depends_on:
      - db
      - soketi
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/Dockerfile

  frontend:
    build:
      context: ./frontend
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "100"
      # Process env wins over frontend/.env in Vite, so local dev always uses soketi.
      VITE_PUSHER_KEY: mordheim-local-key
      VITE_PUSHER_CLUSTER: local
      VITE_PUSHER_HOST: localhost
      VITE_PUSHER_PORT: "6001"
      VITE_PUSHER_FORCE_TLS: "0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/Dockerfile

  # Local Pusher-compatible server for realtime (chat, pings, battles, trades).
  soketi:
    image: quay.io/soketi/soketi:1.6-16-debian
    environment:
      SOKETI_DEFAULT_APP_ID: "1234"
      SOKETI_DEFAULT_APP_KEY: mordheim-local-key
      SOKETI_DEFAULT_APP_SECRET: mordheim-local-secret
    ports:
      - "6001:6001"

  pgweb:
    image: sosedoff/pgweb
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/mordheim?sslmode=disable
    ports:
      - "8081:8081"
    depends_on:
      - db

volumes:
  postgres_data:
  frontend_node_modules:
  backend_venv:
