<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- The browser bar takes the page colour; theme-init.js and lib/theme.ts switch it with the theme. -->
    <meta name="theme-color" content="#0f0c09" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Mordheim Chronicler</title>
    <!-- The page colour before the stylesheet arrives (design E's --color-page, dark and light). -->
    <style>
      html {
        background: #0f0c09;
        color-scheme: dark;
      }
      html[data-theme="light"] {
        background: #e8dfd0;
        color-scheme: light;
      }
    </style>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
